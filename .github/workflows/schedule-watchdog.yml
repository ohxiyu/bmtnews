name: BMTNews Schedule Watchdog

on:
  schedule:
    # One check after the 20:30 grace period avoids 23 no-op runs per day.
    - cron: '47 20 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

concurrency:
  group: bmtnews-schedule-watchdog
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check daily edition heartbeat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -m src.schedule_watchdog
          --repository "${GITHUB_REPOSITORY}"
          --workflow daily-summary.yml
          --ref main
          --timezone Asia/Shanghai
          --cutoff-hour 20
          --grace-minutes 30
