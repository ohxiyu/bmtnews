name: BMTNews Schedule Watchdog

on:
  schedule:
    # After the 20:30 grace period, require a success for the 20:00 edition.
    - cron: '43 * * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

concurrency:
  group: bmtnews-schedule-watchdog
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check daily edition heartbeat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -m src.schedule_watchdog
          --repository "${GITHUB_REPOSITORY}"
          --workflow daily-summary.yml
          --ref main
          --timezone Asia/Shanghai
          --cutoff-hour 20
          --grace-minutes 30
