name: 信息源变更
description: 新增、编辑、暂停、恢复或删除 BMTNews 信息源
title: "[Source] "
labels:
  - source-change
body:
  - type: markdown
    attributes:
      value: |
        此表单由来源控制台自动填写。正式配置只会通过独立分支和 Pull Request 更新。
        不要提交 API Key、Cookie、私有 Feed、登录凭据或内部地址。

  - type: dropdown
    id: operation
    attributes:
      label: 操作类型 / Operation
      options:
        - add — 新增
        - update — 编辑
        - pause — 暂停
        - resume — 恢复
        - remove — 删除
    validations:
      required: true

  - type: dropdown
    id: source-type
    attributes:
      label: 来源类型 / Source type
      options:
        - rss — RSS
        - telegram — Telegram
        - github — GitHub Releases
        - reddit — Reddit
        - hackernews — Hacker News
        - google_news — Google News
        - gdelt — GDELT
        - ossinsight — OSS Insight
    validations:
      required: true

  - type: input
    id: source-key
    attributes:
      label: 来源键 / Source key
      description: 控制台生成的稳定定位值；新增来源时为 new。
      placeholder: rss|https://example.com/feed.xml
    validations:
      required: true

  - type: input
    id: source-name
    attributes:
      label: 名称 / Name
      placeholder: Example Crypto News
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: 地址或标识 / Endpoint
      description: RSS URL、Telegram 频道、owner/repository 或 subreddit。
      placeholder: https://example.com/feed.xml
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: 分类 / Category
      description: 必须使用当前出刊策略中已经配置的分类。
      placeholder: crypto-markets
    validations:
      required: true

  - type: dropdown
    id: target-state
    attributes:
      label: 目标状态 / Target state
      options:
        - true — 启用
        - false — 暂停
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 调整原因 / Reason
      description: 说明来源价值、重复情况或停用原因。
      placeholder: 为什么需要这次调整？
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认 / Confirmation
      options:
        - label: 我确认信息中不包含密钥、凭据、私有地址或生产状态文件。
          required: true
