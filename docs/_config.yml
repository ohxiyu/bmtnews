theme: jekyll-theme-cayman
title: BMTNews
description: Crypto market intelligence covering exchanges, markets, security, regulation, and protocols
baseurl: ""
url: "https://bmt.news"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
exclude:
  - ".github"
  - "node_modules"
  - "configuration.md"
  - "extractors.md"
  - "horizon-hub-design.md"
  - "scoring.md"
  - "scrapers.md"
  - "twitter-cookies.md"
  - "assets/horizon-header.svg"
  - "assets/css/horizon.css"
  - "assets/js/horizon.js"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
