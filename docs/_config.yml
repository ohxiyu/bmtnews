theme: jekyll-theme-cayman
title: Horizon Daily
description: AI-curated crypto intelligence covering exchanges, markets, security, regulation, and protocols
baseurl: ""
url: "https://horizon-ohxiyu.pages.dev"
repository_url: "https://github.com/ohxiyu/Horizon"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
